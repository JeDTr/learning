server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Không rewrite path: /api/search -> http://api:8000/api/search (giữ nguyên
    # prefix /api vì proxy_pass ở đây không có path riêng sau host:port).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
