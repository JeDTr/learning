services:
  # Elasticsearch KHÔNG chạy trong compose này — demo trỏ thẳng tới Elastic Cloud
  # qua ELASTICSEARCH_URL/API_KEY trong api/.env (xem api/.env.example).
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api
